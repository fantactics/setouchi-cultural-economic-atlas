<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
<title id="title">直島を支える二つの水のルート</title>
<desc id="desc">一つは岡山県の高梁川から倉敷市の浄水場、玉野市、海底送水管を経て直島に届く水。もう一つは直島ダムから直島浄水場を経て、主に工場で使われる島内の水。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbf8"/><stop offset="1" stop-color="#eef5f2"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b5d9e7"/><stop offset="1" stop-color="#d6eaf1"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#26748d"/></marker>
 <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a87645"/></marker>
</defs>
<rect width="980" height="560" rx="20" fill="url(#bg)"/>
<text x="46" y="57" fill="#284d47" font-family="sans-serif" font-weight="700" font-size="30">直島の暮らしを支える、二つの水</text>
<text x="47" y="87" fill="#596f6b" font-family="sans-serif" font-size="16">岡山県から海を渡る水と、島に降った雨をためる水</text>
<rect x="38" y="113" width="904" height="228" rx="15" fill="#f3f9fc" stroke="#a9cdd7"/>
<rect x="38" y="113" width="553" height="228" rx="15" fill="#f5f6ee" />
<rect x="592" y="113" width="139" height="228" fill="url(#sea)"/>
<rect x="733" y="113" width="209" height="228" rx="15" fill="#f5f6ee"/>
<text x="57" y="143" font-family="sans-serif" fill="#456d62" font-size="16" font-weight="700">岡山県</text>
<text x="611" y="143" font-family="sans-serif" fill="#36728b" font-size="16" font-weight="700">瀬戸内海</text>
<text x="757" y="143" font-family="sans-serif" fill="#456d62" font-size="16" font-weight="700">香川県・直島</text>
<g fill="#fff" stroke="#6fa5b7" stroke-width="2">
 <rect x="56" y="173" width="132" height="100" rx="12"/>
 <rect x="233" y="173" width="150" height="100" rx="12"/>
 <rect x="428" y="173" width="135" height="100" rx="12"/>
 <rect x="757" y="173" width="160" height="100" rx="12"/>
</g>
<g font-family="sans-serif" fill="#253f47" text-anchor="middle">
<text x="122" y="213" font-size="22" font-weight="700">高梁川</text>
<text x="122" y="237" font-size="14">取水</text>
<text x="308" y="207" font-size="19" font-weight="700">倉敷市内</text>
<text x="308" y="231" font-size="16">広域浄水場</text>
<text x="308" y="251" font-size="12" fill="#657d80">岡山県南部水道企業団</text>
<text x="495" y="213" font-size="20" font-weight="700">玉野市</text>
<text x="495" y="238" font-size="13">田井配水池など</text>
<text x="837" y="208" font-size="18" font-weight="700">鶴石受水場</text>
<text x="837" y="231" font-size="14">→ 風戸山配水池</text>
<text x="837" y="253" font-size="13" fill="#607478">家庭・工場などへ</text>
</g>
<g stroke="#26748d" stroke-width="3.5" marker-end="url(#arrow)" fill="none">
<path d="M189 224 L228 224"/>
<path d="M384 224 L423 224"/>
<path d="M563 224 L746 224"/>
</g>
<g font-family="sans-serif" text-anchor="middle" fill="#286c89">
<text x="657" y="195" font-size="16" font-weight="700">海底送水管</text>
<text x="656" y="254" font-size="13">1969年 通水</text>
</g>
<text x="58" y="319" font-family="sans-serif" fill="#54716e" font-size="14">※ 浄水施設と給水の関係を示す概念図。配管の実際の経路・地形・距離は表していません。</text>
<rect x="38" y="366" width="904" height="123" rx="15" fill="#fff8f0" stroke="#dec3a2"/>
<text x="58" y="398" font-family="sans-serif" fill="#986339" font-size="16" font-weight="700">もう一つの水源｜直島の雨</text>
<rect x="59" y="417" width="193" height="49" rx="9" fill="#fff" stroke="#c99868"/>
<rect x="334" y="417" width="200" height="49" rx="9" fill="#fff" stroke="#c99868"/>
<rect x="626" y="417" width="263" height="49" rx="9" fill="#fff" stroke="#c99868"/>
<g font-family="sans-serif" fill="#6d503a" text-anchor="middle" font-size="18" font-weight="700">
<text x="155" y="448">直島ダム</text><text x="434" y="448">直島浄水場</text><text x="757" y="448">主に工場用水</text>
</g>
<g stroke="#a87645" stroke-width="3.5" marker-end="url(#arrow2)" fill="none">
<path d="M254 442 L325 442"/>
<path d="M535 442 L615 442"/>
</g>
<text x="47" y="529" fill="#586f6b" font-family="sans-serif" font-size="15">資料：直島町水道ビジョン（2019年）・玉野市「水道水ができるまで」</text>
</svg>