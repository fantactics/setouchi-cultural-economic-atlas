name: Validate ATLAS sites

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node scripts/check-cms-essays.mjs
      - run: node scripts/check-kii-articles.mjs
      - run: node scripts/check-kii-cms-articles.mjs
      - run: npm run build
      - run: node scripts/check-cms-rendered-pages.mjs
      - run: node scripts/package-kii.mjs
      - run: node scripts/check-kii-cms-rendered.mjs
      - name: Check generated SETOUCHI and KII entry points
        run: |
          test -f dist/index.html
          test -f dist/kii/index.html
          test -f dist-kii/index.html
          test -f dist-kii/book/index.html
          grep -q '今日は、どの紀伊半島へ？' dist-kii/book/index.html
          grep -q 'いま、どんな風景が気になる？' dist-kii/book/index.html
          grep -q 'タイトルを、ずらり。' dist-kii/book/index.html
          grep -q 'kii-magazine-category' dist-kii/book/index.html
          grep -q 'kii-magazine-story' dist-kii/book/index.html
          test -f dist-kii/regions/index.html
          test -f dist-kii/nature/index.html
          test -f dist-kii/about/index.html
          grep -q 'ランドスケープ = ネイチャー x カルチャー' dist-kii/about/index.html
          ! grep -q 'STORIES FROM THE KII PENINSULA' dist-kii/index.html
          grep -q 'href="/about/"' dist-kii/index.html
          test -f dist-kii/book/hashiguiiwa-rocks-sunrise-and-legends/index.html
          test -f dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          test -f dist-kii/book/koyasan-mountain-top-basin-city/index.html
          grep -q '高野山は、山の頂上ではなかった' dist-kii/regions/index.html
          grep -q '橋杭岩は、なぜ橋にならなかったのか' dist-kii/index.html
          grep -q '地名から' dist-kii/index.html
          grep -q '自然条件から' dist-kii/index.html
          grep -q '那智の滝の場所を決めた二種類の岩' dist-kii/regions/index.html
          grep -q '多雨' dist-kii/nature/index.html
          grep -q '地質境界' dist-kii/nature/index.html
          grep -q '火成岩' dist-kii/nature/index.html
          grep -q '堆積岩' dist-kii/nature/index.html
          grep -q '地質境界' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          test -f dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          ! grep -q '出典・参照資料' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          ! grep -q '出典・参照資料' dist-kii/book/koyasan-mountain-top-basin-city/index.html
          ! grep -q '<figcaption>' dist-kii/book/arida-mikan-climbs-the-hillside/index.html
          grep -q 'aria-label="自然条件タグ"' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          test -f dist-kii/book/shirarahama-white-sand-across-the-sea/index.html
          test -f dist-kii/book/arida-mikan-climbs-the-hillside/index.html
          grep -q '那智の滝の場所を決めた二種類の岩' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          grep -q '南紀熊野ジオパーク' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          grep -q '那智黒' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          grep -q '熊野那智大社の別宮' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          grep -q '土産店' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          ! grep -q 'この石と、温泉の熱は同じものだろうか' dist-kii/book/nachi-waterfall-where-rock-meets-faith/index.html
          grep -q '白良浜の白い砂は、海を渡ってきた' dist-kii/book/shirarahama-white-sand-across-the-sea/index.html
          grep -q 'みかん畑は、なぜ山を登ったのか' dist-kii/book/arida-mikan-climbs-the-hillside/index.html
          test -f dist-kii/robots.txt
          grep -q 'https://kii-atlas.pages.dev/' dist-kii/index.html
          if grep -q 'https://fantactics.github.io/setouchi-cultural-economic-atlas/kii/' dist-kii/index.html; then echo 'Standalone KII canonical still points to SETOUCHI'; exit 1; fi
          grep -q 'SETOUCHI ATLAS' dist/index.html
          grep -q 'KII ATLAS' dist/kii/index.html
          grep -q '紀伊半島のエッセイを探す' dist/kii/index.html
          grep -q 'index,follow' dist/kii/index.html
          if grep -q 'noindex,follow' dist/index.html; then echo 'SETOUCHI must remain indexable'; exit 1; fi
          grep -q 'reader-essay-card' dist/index.html
          grep -q '那智の滝の場所を決めた二種類の岩' dist/kii/index.html
          grep -q '白良浜の白い砂は、海を渡ってきた' dist/kii/index.html
          grep -q 'みかん畑は、なぜ山を登ったのか' dist/kii/index.html
          if grep -q 'setouchi-sushi-not-nigiri' dist/kii/index.html; then echo 'KII page leaked SETOUCHI articles'; exit 1; fi
          if grep -q 'rel="sitemap"' dist-kii/index.html; then echo 'Standalone KII references a foreign sitemap'; exit 1; fi
          test -f dist-kii/google9c35f2435ae15949.html
          grep -qx 'google-site-verification: google9c35f2435ae15949.html' dist-kii/google9c35f2435ae15949.html
          test -f dist-kii/sitemap.xml
          grep -q 'https://kii-atlas.pages.dev/book/' dist-kii/sitemap.xml
          grep -q 'https://kii-atlas.pages.dev/sitemap.xml' dist-kii/robots.txt
          ! grep -q 'Disallow: /' dist-kii/robots.txt
          ! grep -q 'noindex,follow' dist-kii/index.html
      - name: Validate SETOUCHI-only GitHub Pages publication
        run: |
          node scripts/prepare-setouchi-pages.mjs
          test ! -e dist/kii
          test -f dist/index.html
          test -f dist/book/index.html
          test -f dist-kii/index.html
          test -f dist-kii/book/index.html
      - name: Upload KII standalone preview for review
        uses: actions/upload-artifact@v4
        with:
          name: kii-atlas-pr-preview
          path: ./dist-kii
          if-no-files-found: error
          retention-days: 14
