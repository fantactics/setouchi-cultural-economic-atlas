name: Validate KII ATLAS independently

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/kii-essays/**'
      - 'src/data/kiiArticles.js'
      - 'src/data/kiiNaturalTags.js'
      - 'src/data/kiiCmsArticles.js'
      - 'src/pages/kii/**'
      - 'src/components/AtlasEssayDetail.astro'
      - 'src/components/AtlasRegionMap.astro'
      - 'scripts/check-kii-*.mjs'
      - 'scripts/package-kii.mjs'
      - '.github/workflows/validate-kii-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kii-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node scripts/check-kii-articles.mjs
      - run: node scripts/check-kii-cms-articles.mjs
      - run: npm run build
      - run: node scripts/package-kii.mjs
      - run: node scripts/check-kii-cms-rendered.mjs
      - name: Confirm new KII historical essay and map
        run: |
          test -f dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '十津川の勤王の志士たちを躊躇させた、山村の米と塩の流通事情' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '山から集まった、千人の力' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q 'そもそも、天誅組とは何者だったのか' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '朝廷への誇りと、山村の自治' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '挙兵の翌日、朝廷の方針が変わった' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q 'もう一度、十津川の谷を見る' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          ! grep -q '大水害' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          ! grep -q '北海道へ' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '米と塩は、山の外から来ていた' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '一万二千八百六十二人' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '二千四百三戸' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q 'わずか約四十人' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '七十〜八十人' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '土佐だけの言葉ではない' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '水郡善之祐' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html
          grep -q '歴史景観' dist-kii/book/index.html
          grep -q 'totsukawa-mountain-villages-and-tenchugumi' dist-kii/regions/index.html
          grep -q 'MAP / 10 PLACES' dist-kii/regions/index.html
          grep -q '十津川の勤王の志士たちを躊躇させた、山村の米と塩の流通事情' dist-kii/nature/index.html
          ! grep -q '出典・参照資料' dist-kii/book/totsukawa-mountain-villages-and-tenchugumi/index.html

      - name: Check Saikazaki stone heritage and geological narrative
        run: |
          test -f dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '海岸の緑の岩が、庭園の美になった' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '和歌山城' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '岡公園' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '西之丸庭園' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '水軒堤防' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '和歌浦天満宮' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '紀州東照宮' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '砂岩の切石' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '三波川変成帯' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '三波川変成帯に属する緑色片岩' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '海底で噴き出した玄武岩' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '変成岩' dist-kii/nature/index.html
          grep -q '中央構造線' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '秩父帯' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '付加体' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
          grep -q '地質境界' dist-kii/nature/index.html
          ! grep -q '出典・参照資料' dist-kii/book/saikazaki-blue-green-stone-garden/index.html
