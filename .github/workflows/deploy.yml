name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate KII content
        run: node scripts/check-kii-articles.mjs
      - name: Package standalone KII preview
        run: node scripts/package-kii.mjs
      - name: Upload KII preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: kii-atlas-standalone
          path: ./dist-kii
          if-no-files-found: error
          retention-days: 30
      - name: Verify sitemap output
        run: node scripts/check-sitemap.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
