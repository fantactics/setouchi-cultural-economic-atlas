# Pages CMS for SETOUCHI ATLAS
# Stage 1: edit existing Markdown essays only.
media:
  input: public/images/essays
  output: /setouchi-cultural-economic-atlas/images/essays
  rename: safe
  categories: [image]

content:
  - name: essays
    label: エッセイ（Markdown）
    type: collection
    path: src/content/essays
    format: yaml-frontmatter
    filename: "{primary}.md"
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, subtitle]
      search: [title, subtitle, lead]
    fields:
      - name: slug
        label: 記事ID（URL用・編集不可）
        type: string
        readonly: true
      - name: part
        label: 分類
        type: string
        readonly: true
      - name: cities
        label: 地名
        type: string
        list: true
        readonly: true
      - name: keywords
        label: キーワード
        type: string
        list: true
        readonly: true
      - name: title
        label: タイトル
        type: string
        required: true
      - name: subtitle
        label: サブタイトル
        type: text
      - name: lead
        label: 導入文
        type: text
      - name: body
        label: エッセイ本文
        type: code
        description: 脚注や埋め込みHTMLを保持するためMarkdownソースを直接編集します
        options:
          format: markdown

  # These three simple essays have no HTML footnotes; visual editor trial only.
